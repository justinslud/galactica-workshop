{% extends 'base.html' %}{% block content %}<div class="page-title"><h1>Edit {{article.title}}</h1></div><form method="post">{% csrf_token %}<label>Title<input name="title" value="{{article.title}}"></label><label>Summary<textarea name="summary">{{revision.summary}}</textarea></label><label>Text<textarea name="text">{% if revision.blocks.all %}{{revision.blocks.all.0.content.text}}{% endif %}</textarea></label><button type="submit">Save draft</button></form>{% endblock %}
